syntax = "proto3";

package ET;

// ResponseType Console2Robot_LogoutResponse
message Console2Robot_LogoutRequest // IRequest
{
	int32 RpcId = 1;
}

message Console2Robot_LogoutResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// ResponseType Robot_LoginResponse
message Robot_LoginRequest // IRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
	string Address = 4;
}

message Robot_LoginResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 客户端匹配超时，请求服务端创建一个机器人玩家当对手（机器人登录后进同一张共享地图）
// ResponseType G2C_RequestMatchRobot
message C2G_RequestMatchRobot // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_RequestMatchRobot // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}
