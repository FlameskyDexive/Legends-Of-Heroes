syntax = "proto3";
package ET;

message PetInfo
{
	int64 OwnerId = 1;
}

message UnitInfo
{
	int64 UnitId = 1;
	int32 ConfigId = 2;
	int32 Type = 3;
	Unity.Mathematics.float3 Position = 4;
	Unity.Mathematics.float3 Forward = 5;
	map<int32, int64> KV = 6;
	MoveInfo MoveInfo = 7;
	PetInfo PetInfo = 8;
}

message M2C_CreateUnits // ICurrentMessage
{
	repeated UnitInfo Units = 1;
}

message M2C_CreateMyUnit // ICurrentMessage
{
	UnitInfo Unit = 1;
}

message M2C_StartSceneChange // IMessage
{
	int64 SceneId = 1;
	string SceneName = 2;
}

message M2C_RemoveUnits // ICurrentMessage
{
	repeated int64 Units = 1;
}

message M2C_Error // IMessage
{
	int32 Error = 1;
	repeated string Values = 2;
}

message M2C_NumericChange // ICurrentMessage
{
	int64 UnitId = 1;
	int32 NumericType = 2;
	int64 Value = 3;
}

message C2M_PetAttack // ILocationMessage
{
	int32 RpcId = 1;
	int64 UnitId = 2;
}

// 摇杆/按键操作信息(单条)
message OperateInfo
{
	int32 OperateType = 1; // 操作类型, 对应 EOperateType
	int32 InputType = 2;   // 输入类型(按下/抬起), 对应 EInputType
	Unity.Mathematics.float3 Vec3 = 3; // 方向/位置参数(摇杆方向等)
	int64 Value1 = 4;
	int64 Value2 = 5;
}

// 客户端每帧把收集到的操作批量上报服务端(摇杆移动、技能按键等)
message C2M_Operation // ILocationMessage
{
	int32 RpcId = 1;
	repeated OperateInfo OperateInfos = 2;
}
